[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-harness-local-ocr-service"
version = "0.1.0"
description = "Loopback-only OCR service for the DeepSeek Harness local OCR plugin"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "numpy==2.3.5",
  "pillow==12.3.0",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "uvicorn[standard]==0.52.3",
]

[project.optional-dependencies]
ocr = [
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.1",
]
test = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "pytest-asyncio==0.26.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
